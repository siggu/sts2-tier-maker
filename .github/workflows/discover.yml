name: 위키 구조 탐색 (임시)

on:
  workflow_dispatch:
  push:
    branches: [discover]

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/discover.mjs /tmp/raw
      - name: raw 브랜치에 결과 올리기
        run: |
          cd /tmp/raw
          git init -q -b raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "wiki discovery $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" raw
