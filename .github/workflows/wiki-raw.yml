name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 카드 틀 재료 찾기
        run: |
          set -u
          rm -rf raw && mkdir -p raw/frame
          node -e '
            const UA = { "User-Agent": "sts2-tier-maker/1.0 (https://github.com/siggu/sts2-tier-maker)" };
            const W = "https://slaythespire.wiki.gg/api.php?format=json&formatversion=2&";
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            (async () => {
              const out = {};
              for (const prefix of ["StS2 Card", "StS2_Card", "StS2 Frame", "StS2 Banner", "StS2 Portrait", "StS2 Energy", "StS2 Orb", "StS2 Rarity", "StS2 UI", "StS2 Template", "StS2 Blank", "StS2 Star", "StS2 Ironclad-Strike", "StS2 Beta-Ironclad"]) {
                const r = await (await fetch(W + new URLSearchParams({ action: "query", list: "allimages", aiprefix: prefix, ailimit: "500", aiprop: "url|size" }), { headers: UA })).json();
                out[prefix] = (r.query?.allimages || []).map(f => `${f.name} ${f.width}x${f.height} ${f.url}`);
                await sleep(700);
              }
              for (const q of ["card frame", "card banner", "card template", "frame attack", "card background"]) {
                const r = await (await fetch(W + new URLSearchParams({ action: "query", list: "search", srnamespace: "6", srsearch: q, srlimit: "50" }), { headers: UA })).json();
                out["search: " + q] = (r.query?.search || []).map(p => p.title);
                await sleep(700);
              }
              require("fs").writeFileSync("raw/frame/list.json", JSON.stringify(out, null, 1));
            })();'
      - name: 커밋
        run: |
          git add -A raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "카드 틀 재료 (임시)" && git push
