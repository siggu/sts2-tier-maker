name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 위키 카드 모듈 구조 확인
        run: |
          set -u
          W=https://slaythespire.wiki.gg
          UA='sts2-tier-maker/1.0 (https://github.com/siggu/sts2-tier-maker)'
          rm -rf raw && mkdir -p raw/check
          api() { curl -sS -A "$UA" "$W/api.php?format=json&$1"; sleep 1; }
          enc() { node -e 'console.log(encodeURIComponent(process.argv[1]))' "$1"; }
          mkdir -p raw/cargo
          dump() { # 표 이름, 필드, 조건 → raw/cargo/표.json (500개씩)
            node -e '
              const [table, fields, where] = process.argv.slice(1); const all = [];
              (async () => { for (let off = 0; ; off += 500) {
                const qs = new URLSearchParams({ action: "cargoquery", format: "json", tables: table, fields, where, limit: "500", offset: String(off) });
                const r = await (await fetch("https://slaythespire.wiki.gg/api.php?" + qs, { headers: { "User-Agent": "sts2-tier-maker/1.0 (https://github.com/siggu/sts2-tier-maker)" } })).json();
                if (r.error) { console.error(r.error); process.exit(1); }
                const rows = (r.cargoquery || []).map(x => x.title); all.push(...rows);
                if (rows.length < 500) break; await new Promise(z => setTimeout(z, 800)); }
                require("fs").writeFileSync("raw/cargo/" + table + ".json", JSON.stringify(all, null, 1)); console.log(table, all.length); })();' "$@"
          }
          dump Cards '_pageName,Name,Game,Image,Color,OverrideColor,Type,Rarity,Cost,CostPlus,StarCost,NoUpgrade,MultiplayerOnly,Tags,Description,Link' 'Game="2"'
          dump CardArt '_pageName,Name,Game,Icon,Art,BetaArt,FullCard,FullCardPlus,FullCardBeta,FullCardBetaPlus,Link' 'Game="2"'
          dump Relics '_pageName' '1=1' || true
      - name: 커밋
        run: |
          git add -A raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "위키 Cargo 표 (임시)" && git push
