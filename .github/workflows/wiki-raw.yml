name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 위키 카드 모듈 구조 확인
        run: |
          set -u
          W=https://slaythespire.wiki.gg
          UA='sts2-tier-maker/1.0 (https://github.com/siggu/sts2-tier-maker)'
          rm -rf raw && mkdir -p raw/check
          api() { curl -sS -A "$UA" "$W/api.php?format=json&$1"; sleep 1; }
          enc() { node -e 'console.log(encodeURIComponent(process.argv[1]))' "$1"; }
          F='_pageName,Name,Game,Image,Color,OverrideColor,Type,Rarity,Cost,CostPlus,StarCost,NoUpgrade,MultiplayerOnly,Tags,Description'
          api "action=cargoquery&tables=Cards&fields=$F&where=$(enc 'Name IN ("Crimson Mantle","Bash","Dowsing","Royal Gamble","Mad Science","Strike (Ironclad)","Juggernaut","Expect a Fight","Shiv","Ascender'"'"'s Bane")')&limit=50" > raw/check/cargo-sample.json
          api "action=cargoquery&tables=Cards&fields=Game,COUNT(*)=n&group_by=Game&limit=50" > raw/check/cargo-games.json
          api "action=cargoquery&tables=CardArt&fields=_pageName&limit=5" > raw/check/cargo-art.json
          api "action=cargofields&table=CardArt" > raw/check/cargo-art-fields.json
          api "action=cargofields&table=Cards" > raw/check/cargo-card-fields.json
      - name: 커밋
        run: |
          git add -A raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "위키 구조 확인 3 (임시)" && git push
