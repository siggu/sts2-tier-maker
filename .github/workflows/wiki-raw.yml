name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 위키 카드 모듈 구조 확인
        run: |
          set -u
          W=https://slaythespire.wiki.gg
          UA='sts2-tier-maker/1.0 (https://github.com/siggu/sts2-tier-maker)'
          rm -rf raw && mkdir -p raw/check
          api() { curl -sS -A "$UA" "$W/api.php?format=json&$1"; sleep 1; }
          enc() { node -e 'console.log(encodeURIComponent(process.argv[1]))' "$1"; }
          for t in "Module:Cards" "Module:Cards/doc" "Module:Cards/filtering" "Module:Cards/tooltip" "Template:Card Infobox" "Slay the Spire 2:Crimson Mantle"; do
            f=$(echo "$t" | sed 's/[^A-Za-z0-9._-]/_/g')
            curl -sS -A "$UA" -o "raw/check/$f.txt" -w "$t %{http_code} %{size_download}\n" "$W/index.php?title=$(enc "$t")&action=raw" || true
            sleep 1
          done
          api "action=cargotables" > raw/check/cargotables.json
          api "action=cargoquery&tables=StS2_Cards&fields=_pageName,Name,Cost,Rarity,Type,Color,Image,Description&limit=3" > raw/check/cargo-try1.json
          api "action=cargoquery&tables=Cards&fields=_pageName&limit=3" > raw/check/cargo-try2.json
      - name: 커밋
        run: |
          git add -A raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "위키 구조 확인 2 (임시)" && git push
