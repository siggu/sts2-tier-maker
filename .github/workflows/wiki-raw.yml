name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/term-popups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - name: 데이터·이미지 수집 (public-beta 그림 포함)
        run: node tools/fetch-data.mjs
      - name: wip/term-popups 에 커밋
        run: |
          git add site/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "data: 위키 데이터 갱신 (용어 팝업)" && git push origin HEAD:wip/term-popups
