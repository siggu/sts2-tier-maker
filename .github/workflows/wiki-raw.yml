name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: untapped 상세 페이지 받기
        run: node tools-tmp/scrape.mjs
      - name: 커밋
        run: |
          git add raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "untapped 항목 문구 (임시)" && git push
