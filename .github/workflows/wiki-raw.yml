name: (임시) 위키 원본 받기
on:
  push:
    branches: [wip/wiki-raw]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: untapped 카드 HTML·CSS 받기
        run: |
          set -u
          rm -rf raw && mkdir -p raw/ut/css
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          for p in ko/cards/crimson-mantle ko/cards/abundance ko/cards/devastate ko/cards/ascenders-bane en/cards/crimson-mantle ja/cards/crimson-mantle; do
            curl -sS -L -A "$UA" -o "raw/ut/$(echo $p | tr / _).html" "https://sts2.untapped.gg/$p"; sleep 1
          done
          grep -ohE '/_next/static/[^"'"'"' ]+\.css' raw/ut/*.html | sort -u > raw/ut/css-list.txt
          while read -r c; do curl -sS -A "$UA" -o "raw/ut/css/$(basename "$c")" "https://sts2.untapped.gg$c"; sleep 0.5; done < raw/ut/css-list.txt
          # 카드 조립에 쓰는 그림 주소 몇 개 (헤더만)
          grep -ohE 'https://sts2json\.untapped\.gg/[^"'"'"' )\\]+' raw/ut/*.html | sort -u > raw/ut/asset-urls.txt
          grep -ohE 'https://[a-z0-9.-]*untapped\.gg/[^"'"'"' )\\]+\.(webp|png|woff2?|ttf|otf)' raw/ut/css/*.css | sort -u > raw/ut/css-asset-urls.txt || true
          head -5 raw/ut/asset-urls.txt | while read -r u; do curl -sSI -A "$UA" "$u" | head -5 >> raw/ut/asset-headers.txt; echo "--- $u" >> raw/ut/asset-headers.txt; done
          ls -la raw/ut raw/ut/css
      - name: 커밋
        run: |
          git add -A raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "untapped 카드 HTML (임시)" && git push
