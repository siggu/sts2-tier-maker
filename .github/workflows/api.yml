name: 밸런스 투표 API 배포 (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'site/data/keys.json'
      - '.github/workflows/api.yml'
  # 데이터 갱신 워크플로가 GITHUB_TOKEN 으로 커밋하면 push 이벤트가 생기지 않으므로 이어서 실행한다.
  workflow_run:
    workflows: ['게임 데이터 갱신']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 계정 ID 는 wrangler.toml 의 account_id 를 쓴다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Cloudflare 시크릿 확인
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: D1 데이터베이스 찾기(없으면 생성)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          find_id() {
            if ! out="$(npx wrangler d1 list --json 2>&1)"; then
              echo "$out" >&2
              echo >&2 "::error::Cloudflare D1 목록을 읽지 못했습니다. API 토큰에 'Account · D1 · Edit' 권한이 있는지, api/wrangler.toml 의 account_id 가 토큰의 계정과 같은지 확인하세요."
              return 1
            fi
            # wrangler 가 JSON 앞뒤로 안내 문구를 찍을 수 있어 배열 부분만 읽는다.
            printf '%s' "$out" | node -e '
              const text = require("fs").readFileSync(0, "utf8");
              const list = JSON.parse(text.slice(text.indexOf("["), text.lastIndexOf("]") + 1));
              const db = list.find(d => d.name === "sts2-balance");
              process.stdout.write(db ? db.uuid : "");'
          }
          id="$(find_id)" || exit 1
          if [ -z "$id" ]; then
            npx wrangler d1 create sts2-balance
            id="$(find_id)" || exit 1
          fi
          test -n "$id"
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: 마이그레이션 적용
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply sts2-balance --remote

      - name: 배포
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy
