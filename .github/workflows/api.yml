name: 밸런스 투표 API 배포 (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'site/data/keys.json'
      - '.github/workflows/api.yml'
  # 데이터 갱신 워크플로가 GITHUB_TOKEN 으로 커밋하면 push 이벤트가 생기지 않으므로 이어서 실행한다.
  workflow_run:
    workflows: ['게임 데이터 갱신']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 계정 ID 는 wrangler.toml 의 account_id 를 쓴다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Cloudflare 시크릿 확인
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: D1 데이터베이스 찾기(없으면 생성)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          find_id() {
            if ! out="$(npx wrangler d1 list --json 2>&1)"; then
              echo "$out" >&2
              echo >&2 "::error::Cloudflare D1 목록을 읽지 못했습니다. API 토큰에 'Account · D1 · Edit' 권한이 있는지, api/wrangler.toml 의 account_id 가 토큰의 계정과 같은지 확인하세요."
              return 1
            fi
            # wrangler 가 JSON 앞뒤로 안내 문구를 찍을 수 있어 배열 부분만 읽는다.
            printf '%s' "$out" | node -e '
              const text = require("fs").readFileSync(0, "utf8");
              const list = JSON.parse(text.slice(text.indexOf("["), text.lastIndexOf("]") + 1));
              const db = list.find(d => d.name === "sts2-balance");
              process.stdout.write(db ? db.uuid : "");'
          }
          id="$(find_id)" || exit 1
          if [ -z "$id" ]; then
            npx wrangler d1 create sts2-balance
            id="$(find_id)" || exit 1
          fi
          test -n "$id"
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: 마이그레이션 적용
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply sts2-balance --remote

      - name: 배포
        if: steps.secrets.outputs.ok == 'true'
        # 처음 만든 Worker 는 업로드 직후 설정 조회가 '없는 Worker'(10007)로 실패할 수 있어 한 번 더 시도한다.
        # 그래도 실패했는데 오류가 권한 문제(Workers AI 권한이 없는 토큰)로 보이면 [ai] 묶음을 뺀 임시 설정으로 배포한다.
        # 그러면 이미지 검열 AI 가 없어 새 이미지는 모두 'pending'(관리자 검토)으로 저장된다.
        run: |
          deploy() { npx wrangler deploy "$@" 2>&1 | tee -a deploy.log; return "${PIPESTATUS[0]}"; }
          deploy && exit 0
          sleep 10
          deploy && exit 0
          if ! grep -Eiq 'workers ai|\bai\b|10000|authentication error|permission|unauthori[sz]ed|forbidden' deploy.log; then
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("wrangler.toml", "utf8");
            // [ai] 표 머리와 바로 뒤의 키 줄(binding = …)을 지운다
            const out = src.replace(/^\[ai\][ \t]*\r?\n(?:[ \t]*[A-Za-z_][^\n]*\r?\n)*/m, "");
            if (out === src) process.exit(1);
            fs.writeFileSync("wrangler.no-ai.toml", out);'
          echo "::warning::Workers AI 바인딩 없이 배포했습니다. CLOUDFLARE_API_TOKEN 에 'Account · Workers AI · Read'(또는 Edit) 권한을 추가하세요. 그 전까지 올린 이미지는 AI 검사 없이 'pending' 으로 저장되어 관리자 검토(#/admin)를 기다립니다."
          deploy --config wrangler.no-ai.toml

      - name: 배포 확인 (상태·CORS·투표 저장 후 삭제)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          API=https://sts2-balance-api.siggu100.workers.dev
          ORIGIN=https://siggu.github.io
          ITEM="$(node -e 'process.stdout.write(require("../site/data/keys.json").find(k => k.startsWith("curses/")))')"
          VOTER="ci-smoke-${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            curl -fsS "$API/health" && break
            sleep 10
          done
          echo
          # 새 코드가 올라갔는지: 관리자 경로는 로그인 없이 401, 없는 이미지는 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API/admin/images")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$API/img/00000000000000000000000000000000")" = 404
          curl -fsS -o /dev/null -D - -X OPTIONS -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' "$API/balance" \
            | grep -i "access-control-allow-origin: $ORIGIN"
          curl -fsS -H "Origin: $ORIGIN" -H 'Content-Type: application/json' \
            -d "{\"voter\":\"$VOTER\",\"votes\":[{\"item\":\"$ITEM\",\"v\":\"fair\"}]}" "$API/balance"
          echo
          curl -fsS "$API/balance?category=curses" | node -e '
            const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const c = r.items[process.argv[1]];
            if (!c || c[1] < 1) { console.error("투표가 결과에 보이지 않음", r); process.exit(1); }
            console.log("결과 확인:", process.argv[1], c);' "$ITEM" || {
            # 결과는 30초 캐시되므로 처음 조회에 없으면 기다렸다 다시 본다
            sleep 35
            curl -fsS "$API/balance?category=curses" | grep -q "\"$ITEM\""
          }
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"voter\":\"$VOTER\",\"votes\":[{\"item\":\"$ITEM\",\"v\":null}]}" "$API/balance"
          echo
          echo "시험 투표를 지웠습니다."
