name: 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # 데이터 갱신 워크플로가 GITHUB_TOKEN 으로 커밋하면 push 이벤트가 생기지 않으므로 이어서 실행한다.
  workflow_run:
    workflows: ['게임 데이터 갱신']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 캐시 무효화용 버전 붙이기
        run: tools/stamp-version.sh site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # 같은 사이트를 Cloudflare Pages(https://sts2-tier-maker.pages.dev)에도 올린다.
  # CLOUDFLARE_API_TOKEN 에 'Account · Cloudflare Pages · Edit' 권한이 있어야 한다. 프로젝트가 없으면 처음 한 번 만든다.
  cloudflare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b1d2ece49f3654aba38c2e31ef484072 # api/wrangler.toml 의 account_id (비밀 값 아님)
      WRANGLER: npx --yes wrangler@4.143.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 캐시 무효화용 버전 붙이기
        run: tools/stamp-version.sh site "${GITHUB_SHA::8}"
      - name: Cloudflare Pages 배포
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 Cloudflare Pages 배포를 건너뜁니다."
            exit 0
          fi
          hint="::error::Cloudflare Pages 배포에 실패했습니다. CLOUDFLARE_API_TOKEN 에 'Account · Cloudflare Pages · Edit' 권한이 있는지 확인하세요."
          if ! list="$($WRANGLER pages project list 2>&1)"; then
            echo "$list"; echo "$hint"; exit 1
          fi
          if ! printf '%s' "$list" | grep -q 'sts2-tier-maker'; then
            $WRANGLER pages project create sts2-tier-maker --production-branch main || { echo "$hint"; exit 1; }
          fi
          $WRANGLER pages deploy site --project-name sts2-tier-maker --branch main --commit-dirty=true || { echo "$hint"; exit 1; }
          # 실제 주소 (이름이 이미 쓰이고 있으면 Cloudflare 가 뒤에 글자를 붙일 수 있다)
          $WRANGLER pages project list 2>&1 | grep 'sts2-tier-maker' || true
