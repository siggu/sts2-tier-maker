name = "sts2-balance-api"
main = "src/index.js"
# Cloudflare 계정 ID (비밀 값이 아니다). 배포 토큰은 GitHub 시크릿 CLOUDFLARE_API_TOKEN 으로 넣는다.
account_id = "b1d2ece49f3654aba38c2e31ef484072"
compatibility_date = "2026-09-01"
# 사이트가 https://sts2-balance-api.siggu100.workers.dev 로 호출한다.
workers_dev = true
preview_urls = false

# 프런트엔드(GitHub Pages)에서 호출을 허용할 출처. 쉼표로 여러 개 지정.
[vars]
ALLOWED_ORIGINS = "https://siggu.github.io,http://localhost:8000,http://127.0.0.1:8000"
# 구글 로그인 OAuth 클라이언트 ID (공개 값). 비어 있으면 로그인이 꺼진다. site/js/config.js 와 같은 값.
GOOGLE_CLIENT_ID = "713762759027-mo3pdgg1f1pg1jdoobqojvc5lfbo6qo9.apps.googleusercontent.com"
# 관리자 구글 sub (쉼표로 여러 개). 관리자는 아무 글·댓글이나 지울 수 있고 올린 이미지를 검토한다 (#/admin).
ADMIN_SUBS = ""
# 관리자 사용자 id (users.id, 쉼표로 여러 개). 사이트의 프로필 메뉴 '내 ID' 에서 확인한다.
ADMIN_USERS = ""
# 올린 이미지 검열에 쓰는 Workers AI 모델 (앞에서부터 시도, 오류면 다음). 모두 실패하면 'pending' 으로 저장해 관리자가 검토한다.
# 라마 3.2 비전 모델은 계정에서 한 번 라이선스에 동의해야 쓸 수 있다 (API.md).
MODERATION_MODELS = "@cf/meta/llama-3.2-11b-vision-instruct,@cf/llava-hf/llava-1.5-7b-hf"

# 이미지 검열 (moderation.js). 배포 토큰에 Workers AI 권한이 없으면 배포 워크플로가 이 묶음을 빼고 배포한다.
[ai]
binding = "AI"

# database_id 는 배포 워크플로가 계정의 D1 목록에서 찾아(없으면 만들어) 채운다.
[[d1_databases]]
binding = "DB"
database_name = "sts2-balance"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

# 맨 앞 IP 당 요청 수 제한 (src/index.js overFrontLimit). D1 을 쓰지 않는다. namespace_id 는 계정 안에서 겹치지 않는 아무 숫자.
# API: 1분 120번, 이미지(/img/): 1분 600번. 무료 플랜도 쓸 수 있다.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "2301"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "IMG_LIMITER"
namespace_id = "2302"
simple = { limit = 600, period = 60 }

# 투표 처리 중 오류를 Cloudflare 대시보드(Workers → Logs)에서 볼 수 있게 한다.
[observability]
enabled = true
